name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # the generic plugin and film tests cut synthetic video; apt hung here for 8 minutes on 2026-10-22
      - name: ffmpeg, a static build from GitHub
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" -version | head -1
      - name: Install (CPU torch; the CUDA index in pyproject is for local GPUs)
        run: |
          uv venv --python 3.11
          uv pip install --no-sources --torch-backend cpu -e ".[basketball]" pytest
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Benchmark result files re-score against the suite's truth
        shell: bash
        run: |
          shopt -s nullglob
          files=(benchmark/results/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no benchmark results yet"; exit 0; fi
          uv run --no-sync sports-video-coach bench validate "${files[@]}"

  bench-report:
    # A pull request that adds or changes a file in benchmark/results/ gets its score, as the leaderboard page will
    # show it, in this run's Summary tab (`bench report`). Read-only like the rest of this workflow: no comment, no
    # write token, no secret, so it works the same for a pull request from a fork. Fails when a file does not validate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2      # the pull request's merge commit and its first parent, the base branch
      - uses: astral-sh/setup-uv@v7
      - name: Light install, as in the README
        run: uv tool install .
      - name: Score the added or changed result files into the job summary
        shell: bash
        run: |
          mapfile -d '' files < <(git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- 'benchmark/results/*.json')
          echo "result files added or changed: ${#files[@]}"
          sports-video-coach bench report "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
