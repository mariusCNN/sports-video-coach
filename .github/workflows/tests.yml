name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ffmpeg (the generic plugin and film tests cut synthetic video)
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do  # apt sometimes hangs on these runners
            timeout 150 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg && break
            echo "apt attempt $i failed or hung, retrying"
          done
          ffmpeg -version | head -1
      - name: Install (CPU torch; the CUDA index in pyproject is for local GPUs)
        run: |
          uv venv --python 3.11
          uv pip install --no-sources --torch-backend cpu -e ".[basketball]" pytest
      - name: Test
        run: uv run --no-sync pytest -q
