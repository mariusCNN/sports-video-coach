name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # the generic plugin and film tests cut synthetic video; apt hung here for 8 minutes on 2026-10-22
      - name: ffmpeg, a static build from GitHub
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" -version | head -1
      - name: Install (CPU torch; the CUDA index in pyproject is for local GPUs)
        run: |
          uv venv --python 3.11
          uv pip install --no-sources --torch-backend cpu -e ".[basketball]" pytest
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Benchmark result files re-score against the suite's truth
        shell: bash
        run: |
          shopt -s nullglob
          files=(benchmark/results/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no benchmark results yet"; exit 0; fi
          uv run --no-sync sports-video-coach bench validate "${files[@]}"
