name: pypi

# Publishes a release to PyPI with trusted publishing (no token stored here). Run by hand from the Actions tab on a
# release tag, after the tests passed for it. Needs, once, a trusted publisher on pypi.org for project
# sports-video-coach: owner mariusDing, repository sports-video-coach, workflow pypi.yml, environment pypi.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"   # pinned so result PRs build the same way; the uv of the last green master run
      - name: The ref is a release tag that matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo "run this on tag v$version, not $GITHUB_REF"; exit 1; }
      - run: uv build
      - name: The light install works from the built wheel
        run: |
          uv venv "$RUNNER_TEMP/try"
          VIRTUAL_ENV="$RUNNER_TEMP/try" uv pip install dist/*.whl
          "$RUNNER_TEMP/try/bin/sports-video-coach" plugins
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sports-video-coach
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
