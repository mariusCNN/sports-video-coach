name: devcontainer

# Builds .devcontainer/ (the Codespaces rerun environment) and runs the benchmark's no-key commands in it, so the
# "Open in GitHub Codespaces" link keeps working. No secret, no agent call.
on:
  push:
    branches: [master]
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml", "pyproject.toml", "uv.lock"]
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the container, run bench --help and the blind baseline in it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca  # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -e
            ffmpeg -version | head -1
            claude --version
            codex --version
            uv run sports-video-coach bench --help
            uv run sports-video-coach bench baseline --suite svc-bench-3 --track frames --out /tmp/blind.json
            uv run sports-video-coach bench run --agent claude --suite svc-bench-3 --track frames --dry-run
