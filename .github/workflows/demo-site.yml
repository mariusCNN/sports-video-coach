name: demo site

# Runs `sports-video-coach demo` on a light install (as a new user would) and puts its output on GitHub Pages:
# an English landing page, the report page with clips and narration (demo/), and the explained videos.
# Everything in it is synthetic (a drawn video, a pre-written review); no person appears. Doubles as an end-to-end
# check of the light install.

on:
  push:
    branches: [master]
    paths: ["src/sports_video_coach/**", "benchmark/**", "pyproject.toml", ".github/workflows/demo-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ffmpeg, a static build from GitHub (apt hung or failed on these runners several times)
        timeout-minutes: 5
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" -hide_banner -filters | grep -q " ass "
      - name: Noto Sans CJK SC, the film's default font on Linux (fetched, not apt)
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o ~/.local/share/fonts/NotoSansCJKsc-Regular.otf             https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          fc-cache -f ~/.local/share/fonts && fc-list | grep -c "Noto Sans CJK SC"
      - name: Light install, as in the README
        run: uv tool install .
      - name: Demo, English and Chinese, and the static site (English landing page, coaching page in demo/)
        run: sports-video-coach demo --out demo --lang en zh --site _site
      - name: Benchmark leaderboard (benchmark/results, an empty folder gives a "no runs yet" page)
        run: sports-video-coach bench page benchmark/results _site/benchmark
      - name: Page check
        run: sports-video-coach page-check _site _site/demo _site/benchmark
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
