[project]
name = "sports-video-coach"
version = "0.2.0"
description = "Agent-first sports video analysis and coaching: your game or training video -> coaching pages with clips and narration, plus an explained video. Plugins per sport (basketball built in); runs from Claude Code, Codex or any coding agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mariusDing" }]
keywords = ["sports-video-analysis", "video-coaching", "agent-skills", "plugins", "basketball", "sports-analytics", "computer-vision", "video-analysis", "coaching", "scouting", "object-tracking", "ai-agents", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11,<3.12"
# The core (any sport, generic plugin): frames, clips, narration, page, film, publish. The basketball plugin's
# tracking and pose need the `basketball` extra (pip install "sports-video-coach[basketball]"); `uv sync` in a
# clone installs it too (default group below).
dependencies = [
    "edge-tts>=7.3.1",
    "markdown-it-py>=4.2.0",
    "opencv-python>=5.0.0.93",
    "numpy>=2.0",
]

[project.optional-dependencies]
basketball = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "rfdetr>=1.11.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.2",
    "supervision>=0.30.9",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.70.1",
    "trackers>=2.6.1",
    "transformers>=5.19.0",
    "ultralytics>=8.4.177",
    "umap-learn>=0.5.12",
]

[project.urls]
Homepage = "https://github.com/mariusDing/sports-video-coach"
Documentation = "https://github.com/mariusDing/sports-video-coach/tree/master/docs"
Repository = "https://github.com/mariusDing/sports-video-coach"
Issues = "https://github.com/mariusDing/sports-video-coach/issues"
Changelog = "https://github.com/mariusDing/sports-video-coach/blob/master/CHANGELOG.md"

[project.scripts]
sports-video-coach = "sports_video_coach.cli:main"
hoop-tape-miner = "hoop_tape_miner.cli:main"

[project.entry-points."sports_video_coach.plugins"]
basketball = "hoop_tape_miner.plugin:PLUGIN"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
default-groups = ["dev", "basketball"]

[tool.uv.build-backend]
module-name = ["sports_video_coach", "hoop_tape_miner"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
basketball = ["sports-video-coach[basketball]"]
dev = [
    "pytest>=9.1.1",
    "trackeval>=1.3.0",
]
